<script>
    function updatePillPosition(btn, animate) {
        var bar = document.getElementById('pdfTabBar');
        var pill = document.getElementById('pdfTabPill');
        if (!bar || !pill || !btn) return;
        var barRect = bar.getBoundingClientRect();
        var btnRect = btn.getBoundingClientRect();
        var offsetLeft = btnRect.left - barRect.left + bar.scrollLeft;
        var width = btnRect.width;
        if (!animate) {
            pill.style.transition = 'none';
        } else {
            pill.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1)';
        }
        pill.style.transform = 'translateX(' + offsetLeft + 'px)';
        pill.style.width = width + 'px';
        if (!animate) {
            pill.offsetHeight;
            pill.style.transition = '';
        }
    }
    function switchPdf(btn, fileId) {
        var tabs = document.querySelectorAll('.pdf-switcher-tab');
        tabs.forEach(function(t) { t.classList.remove('active'); });
        btn.classList.add('active');
        updatePillPosition(btn, true);
        var iframe = document.querySelector('.responsive-pdf');
        if (iframe) {
            iframe.src = 'https://drive.google.com/file/d/' + fileId + '/preview';
        }
        var downBtn = document.querySelector('.down-btn');
        if (downBtn) {
            downBtn.href = 'https://drive.google.com/uc?export=download&id=' + fileId;
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        var activeBtn = document.querySelector('.pdf-switcher-tab.active');
        if (activeBtn) updatePillPosition(activeBtn, false);
    });
    window.addEventListener('resize', function() {
        var activeBtn = document.querySelector('.pdf-switcher-tab.active');
        if (activeBtn) updatePillPosition(activeBtn, false);
    });
</script>
