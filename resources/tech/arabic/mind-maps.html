    <script>
        function updatePill(tab) {
            const pill = document.getElementById('pdfTabPill');
            if (!pill || !tab) return;
            pill.style.left = tab.offsetLeft + 'px';
            pill.style.width = tab.offsetWidth + 'px';
            tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function switchPdf(tab, fileId) {
            const buttons = document.querySelectorAll('.pdf-switcher-tab');
            buttons.forEach(btn => btn.classList.remove('active'));
            tab.classList.add('active');
            updatePill(tab);
            
            const iframe = document.querySelector('.responsive-pdf');
            if (iframe) {
                iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
            }
            
            const downBtn = document.querySelector('.down-btn');
            if (downBtn) {
                downBtn.href = `https://drive.google.com/uc?export=download&id=${fileId}`;
            }
        }

        window.addEventListener('load', () => {
            const activeTab = document.querySelector('.pdf-switcher-tab.active');
            if (activeTab) updatePill(activeTab);
        });
        window.addEventListener('resize', () => {
            const activeTab = document.querySelector('.pdf-switcher-tab.active');
            if (activeTab) updatePill(activeTab);
        });

        function toggleFullScreen(event) {
            const button = event.currentTarget;
            const pdfWrapper = button.closest('.pdf-wrapper');
            if (!pdfWrapper) return;
            
            if (!document.fullscreenElement) {
                pdfWrapper.requestFullscreen().then(() => {
                    button.innerHTML = '<i class="fa-solid fa-compress"></i> تصغير النافذة';
                }).catch(err => {
                    console.error('Error attempting to enable full-screen mode:', err.message);
                });
            } else {
                document.exitFullscreen().then(() => {
                    button.innerHTML = '<i class="fa-solid fa-expand"></i> تكبير النافذة';
                }).catch(err => {
                    console.error('Error attempting to exit full-screen mode:', err.message);
                });
            }
        }
    </script>
