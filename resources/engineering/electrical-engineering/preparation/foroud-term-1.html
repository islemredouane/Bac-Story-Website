    <script>
        function updatePill(tab) {
            const pill = document.getElementById('pdfTabPill');
            if (!pill || !tab) return;
            pill.style.left = tab.offsetLeft + 'px';
            pill.style.width = tab.offsetWidth + 'px';
            tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function switchPdf(btn, fileId) {
            const tabs = document.querySelectorAll('.pdf-switcher-tab');
            tabs.forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            updatePill(btn);

            const iframe = document.querySelector('.responsive-pdf');
            if (iframe) {
                iframe.src = 'https://drive.google.com/file/d/' + fileId + '/preview';
            }

            const downBtn = document.querySelector('.down-btn');
            if (downBtn) {
                downBtn.href = 'https://drive.google.com/uc?export=download&id=' + fileId;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const activeTab = document.querySelector('.pdf-switcher-tab.active');
            if (activeTab) {
                setTimeout(() => updatePill(activeTab), 50);
            }
        });

        window.addEventListener('resize', () => {
            const activeTab = document.querySelector('.pdf-switcher-tab.active');
            if (activeTab) updatePill(activeTab);
        });
    </script>
