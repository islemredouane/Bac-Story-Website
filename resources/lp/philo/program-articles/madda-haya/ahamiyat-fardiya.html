    <script>
        function updatePill(tab, animate) {
            var bar = document.getElementById('pdfTabBar');
            var pill = document.getElementById('pdfTabPill');
            if (!bar || !pill || !tab) return;
            if (!animate) pill.style.transition = 'none';
            pill.style.left = tab.offsetLeft + 'px';
            pill.style.width = tab.offsetWidth + 'px';
            if (!animate) {
                pill.offsetHeight;
                pill.style.transition = '';
            }
        }
        function switchPdf(tab, fileId) {
            document.querySelectorAll('.pdf-switcher-tab').forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            updatePill(tab, true);
            tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            var iframe = document.getElementById('pdfFrame');
            if (iframe) {
                iframe.src = 'https://drive.google.com/file/d/' + fileId + '/preview';
            }
            var downBtn = document.getElementById('downloadPdfBtn');
            if (downBtn) {
                downBtn.href = 'https://drive.google.com/uc?export=download&id=' + fileId;
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            var activeTab = document.querySelector('.pdf-switcher-tab.active');
            if (activeTab) {
                setTimeout(function() { updatePill(activeTab, false); }, 50);
            }
        });
        window.addEventListener('resize', function() {
            var activeTab = document.querySelector('.pdf-switcher-tab.active');
            if (activeTab) updatePill(activeTab, false);
        });
    </script>
