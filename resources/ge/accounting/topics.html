    <script>
        function updatePillPosition() {
            var activeBtn = document.querySelector('.pdf-switcher-btn.active');
            var pill = document.querySelector('.pdf-switcher-pill');
            if (activeBtn && pill) {
                pill.style.left = activeBtn.offsetLeft + 'px';
                pill.style.width = activeBtn.offsetWidth + 'px';
            }
        }

        function switchPdf(driveId, title, btnElem) {
            var frame = document.getElementById('pdfFrame');
            var docLabel = document.getElementById('docLabel');
            var driveBtn = document.getElementById('driveDownloadBtn');
            
            if (frame) frame.src = 'https://drive.google.com/file/d/' + driveId + '/preview';
            if (docLabel) docLabel.textContent = title;
            if (driveBtn) driveBtn.href = 'https://drive.google.com/file/d/' + driveId + '/view?usp=sharing';
            
            var btns = document.querySelectorAll('.pdf-switcher-btn');
            btns.forEach(function(b) { b.classList.remove('active'); });
            if (btnElem) btnElem.classList.add('active');
            
            updatePillPosition();
        }

        function toggleFullScreen() {
            var elem = document.getElementById('pdfFrameWrap');
            if (!elem) return;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        window.addEventListener('DOMContentLoaded', updatePillPosition);
        window.addEventListener('resize', updatePillPosition);
    </script>
</body>
