        <div class="container">
            <div class="modern-section-header">
                <h2>تواصل معنا</h2>
            </div>
            <div class="contact-methods">
                <div class="contact-card">
                    <div class="contact-icon">

                    </div>
                    <h3>البريد الإلكتروني</h3>
                    <p><a href="mailto:m_redouane@estin.dz">m_redouane@estin.dz</a></p>

                </div>
                <div class="contact-card">
                    <div class="contact-icon">
                        <i class="fa-solid fa-hashtag"></i>
                    </div>
                    <h3>مواقع التواصل</h3>
                    <div class="social-links" style="display: flex;justify-content: center;">
                        <a style="text-decoration: none;" href="https://t.me/islembacdz" class="social-l"
                            target="_blank"><i class="fab fa-telegram-plane"></i></a>
                        <a style="text-decoration: none;"

                    </div>
                </div>
            </div>

            <div class="modern-section-header">
                <h2>أرسل لنا رسالة</h2>
            </div>
            <div class="contact-form">
                <!-- Success / Error Messages -->
                <div class="notification success" id="successMessage">
                    تم إرسال رسالتك بنجاح! سنتواصل معك قريباً.
                </div>

                <div class="notification error" id="errorMessage">
                    حدث خطأ أثناء إرسال الرسالة. يرجى المحاولة مرة أخرى.
                </div>

                <!-- Contact Form -->
                <form id="contactForm" action="api/form.js" method="POST">
                    <div class="form-group">
                        <label for="name">الإسم الكامل</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="أدخل اسمك الكامل"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="أدخل بريدك الإلكتروني" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">الموضوع</label>
                        <input type="text" id="subject" name="subject" class="form-control" placeholder="موضوع رسالتك"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="message">الرسالة</label>
                        <textarea id="message" name="message" class="form-control" placeholder="أدخل رسالتك هنا..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn-primary btn-block">إرسال الرسالة</button>
                </form>
            </div>
