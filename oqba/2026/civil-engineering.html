    <script>
        function updatePill(activeTab) {
            var pill = document.getElementById('pdfTabPill');
            var bar  = document.getElementById('pdfTabBar');
            if (!pill || !bar || !activeTab) return;
            var barRect = bar.getBoundingClientRect();
            var tabRect = activeTab.getBoundingClientRect();
            pill.style.left  = (tabRect.left - barRect.left + bar.scrollLeft) + 'px';
            pill.style.width = tabRect.width + 'px';
        }
        function switchPdf(btn, fileId) {
            document.querySelectorAll('.pdf-switcher-tab').forEach(function(el) {
                el.classList.remove('active');
            });
            btn.classList.add('active');
            updatePill(btn);
            var iframe = document.getElementById('pdfFrame');
            if (iframe) {
                iframe.src = 'https://drive.google.com/file/d/' + fileId + '/preview';
            }
            var dlBtn = document.getElementById('downloadPdfBtn');
            if (dlBtn) {
                dlBtn.href = 'https://drive.google.com/uc?export=download&id=' + fileId;
            }
        }
        window.addEventListener('load', function() {
            var active = document.querySelector('.pdf-switcher-tab.active');
            if (active) updatePill(active);
        });
        window.addEventListener('resize', function() {
            var active = document.querySelector('.pdf-switcher-tab.active');
            if (active) updatePill(active);
        });
    </script>
