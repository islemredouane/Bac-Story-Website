<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توجيهي · تسجيل الدخول</title>
    <meta name="description" content="ادخل إلى توجيهي من BAC STORY — مرشدك الذكي لاختيار التخصص والجامعة في الجزائر.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Pattaya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/app.css">
    <link rel="stylesheet" href="styles/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase.js"></script>
</head>
<body class="auth-body">
    <!-- soft brand background -->
    <div class="auth-bg" aria-hidden="true">
        <span class="auth-blob auth-blob-1"></span>
        <span class="auth-blob auth-blob-2"></span>
    </div>

    <!-- theme toggle, top corner -->
    <button class="icon-btn auth-theme" id="themeBtn" aria-label="تبديل الوضع"><i class="fas fa-moon"></i></button>

    <main class="auth-wrap">
        <section class="auth-card" role="dialog" aria-labelledby="authTitle">
            <div class="auth-logo">توجيهي</div>
            <p class="auth-tag">من BAC STORY</p>

            <h1 class="auth-title" id="authTitle">مرحبا بيك 👋</h1>
            <p class="auth-prop">رفيقك الذكي باه تختار التخصص والجامعة اللي يناسبوك — بكل ثقة وراحة بال.</p>

            <button class="google-btn" id="googleBtn">
                <span class="google-g" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="20" height="20">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                </span>
                <span class="google-btn-label">المتابعة بحساب Google</span>
                <i class="fas fa-spinner google-spin" aria-hidden="true"></i>
            </button>

            <p class="auth-terms">بالمتابعة، أنت توافق على <a href="#">شروط الاستخدام</a> و <a href="#">سياسة الخصوصية</a>.</p>

        </section>

        <p class="auth-foot">  توجيهي - © BAC STORY</p>
    </main>

    <script>
    (() => {
        // Theme logic
        const root = document.documentElement;
        const saved = localStorage.getItem('tw-theme') || 'light';
        root.setAttribute('data-theme', saved);
        const themeBtn = document.getElementById('themeBtn');
        const syncIcon = () => {
            const dark = root.getAttribute('data-theme') === 'dark';
            themeBtn.innerHTML = `<i class="fas fa-${dark ? 'sun' : 'moon'}"></i>`;
        };
        syncIcon();
        themeBtn.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('tw-theme', next);
            syncIcon();
        });
    })();

    // Toast helper
    function showToast(msg, color) {
        let t = document.getElementById('_twToast');
        if (!t) {
            t = document.createElement('div');
            t.id = '_twToast';
            t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#ef4444;color:#fff;padding:10px 22px;border-radius:999px;font-family:var(--font-ui,sans-serif);font-weight:800;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .3s ease;z-index:9999;white-space:nowrap;';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.background = color || '#ef4444';
        t.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(t._hide);
        t._hide = setTimeout(() => { t.style.transform = 'translateX(-50%) translateY(80px)'; }, 3500);
    }

    let _handling = false;
    async function handleSignIn(session) {
        if (_handling) return;
        _handling = true;
        try {
            const user = session.user;
            const { data: profile } = await tw_supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile && profile.completed === true) {
                localStorage.setItem('tw-auth', JSON.stringify({ provider: 'google', uid: user.id }));
                localStorage.setItem('tw-profile', JSON.stringify({
                    ...profile,
                    name: profile.name || user.user_metadata?.full_name || 'صديقي'
                }));
                window.location.href = 'app.html';
            } else {
                await tw_supabase.from('profiles').upsert({
                    id: user.id,
                    email: user.email,
                    name: user.user_metadata?.full_name || user.user_metadata?.name || 'صديقي',
                    avatar_url: user.user_metadata?.avatar_url
                });
                await tw_supabase.from('credits').upsert(
                    { user_id: user.id, balance: 30, total_earned: 30, total_spent: 0 },
                    { onConflict: 'user_id', ignoreDuplicates: true }
                );
                const code = 'TW-' + Math.random().toString(36).slice(2, 7).toUpperCase();
                await tw_supabase.from('referral_codes').upsert(
                    { owner_user_id: user.id, code },
                    { ignoreDuplicates: true }
                );
                const refCode = new URLSearchParams(location.search).get('ref');
                if (refCode) sessionStorage.setItem('tw-pending-ref', refCode);
                localStorage.setItem('tw-auth', JSON.stringify({ provider: 'google', uid: user.id }));
                window.location.href = 'onboarding.html';
            }
        } catch (err) {
            console.error('handleSignIn error:', err);
            // Fallback: store auth and go to onboarding regardless
            localStorage.setItem('tw-auth', JSON.stringify({ provider: 'google', uid: session.user.id }));
            window.location.href = 'onboarding.html';
        }
    }

    // Listen for auth state changes
    tw_supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN' && session) {
            await handleSignIn(session);
        }
    });

    // Explicitly handle hash-based OAuth callback (implicit flow)
    if (location.hash.includes('access_token')) {
        tw_supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) handleSignIn(session);
        });
    }

    // Google button click
    const gBtn = document.getElementById('googleBtn');
    gBtn.addEventListener('click', async () => {
        if (gBtn.classList.contains('is-loading')) return;
        gBtn.classList.add('is-loading');
        gBtn.querySelector('.google-btn-label').textContent = 'جاري الدخول…';
        const { error } = await tw_supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/tawjihi/login.html' }
        });
        if (error) {
            gBtn.classList.remove('is-loading');
            gBtn.querySelector('.google-btn-label').textContent = 'المتابعة بحساب Google';
            showToast('حدث خطأ أثناء تسجيل الدخول — حاول مرة أخرى');
        }
    });
    </script>
</body>
</html>
