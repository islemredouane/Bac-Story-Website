<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script>!function(){var p=location.pathname.split('/').pop();if(['login.html','onboarding.html','index.html',''].indexOf(p)<0){if(!localStorage.getItem('tw-auth'))return void location.replace('login.html');if(!localStorage.getItem('tw-profile'))return void location.replace('onboarding.html')}}()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>توجيهي · مرشدك الجامعي</title>
    <meta name="description" content="توجيهي من BAC STORY — مرشدك الذكي لاختيار التخصص والجامعة في الجزائر.">
    <meta property="og:title" content="توجيهي — مرشدك للجامعة">
    <meta property="og:description" content="منصة ذكاء اصطناعي للتوجيه الجامعي في الجزائر">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&family=Pattaya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/motion.css">
    <link rel="stylesheet" href="styles/app.css">
    <link rel="stylesheet" href="styles/chat-rich.css">
    <link rel="stylesheet" href="styles/skeleton.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase.js"></script>
</head>
<body>
<!-- noise texture overlay — matches landing-v2 premium feel -->
<div class="noise-overlay" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;mix-blend-mode:multiply;background-image:url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E\");"></div>
<div class="app" id="app">
    <!-- sidebar injected by shell.js -->
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim" id="scrim"></div>

    <!-- ===================== MAIN ===================== -->
    <main class="main">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:.5rem">
                <button class="icon-btn mobile-only" id="drawerBtn" aria-label="القائمة"><i class="fas fa-bars"></i></button>
                <span class="topbar-title">المرشد الذكي</span>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="newChatBtn" aria-label="محادثة جديدة" title="محادثة جديدة"><i class="fas fa-pen-to-square"></i></button>
                <button class="icon-btn" id="historyBtn" aria-label="المحادثات السابقة" title="المحادثات"><i class="fas fa-clock-rotate-left"></i></button>
                <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="chat-scroll" id="chatScroll">
            <div class="chat-inner" id="chatInner">
                <!-- empty state -->
                <section class="chat-hero" id="chatHero">
                    <div class="chat-hero-brand">ت</div>
                    <h1>كيفاش نقدر نساعدك اليوم؟</h1>
                    <p>سألني عن تخصصات الجامعة، معدلات القبول، أو ساعدني نرتّب بطاقة رغباتك.</p>
                    <button class="hero-discover-btn" id="discoverBtn">
                        <i class="fas fa-compass"></i>
                        لا تعرف من أين تبدأ؟ اكتشف مجالك
                    </button>
                    <div class="hero-suggestions">
                        <button class="hero-chip" data-q="شنو معدل القبول في الطب والصيدلة هذا العام؟">🩺 الطب</button>
                        <button class="hero-chip" data-q="شنو أحسن مدارس الإعلام الآلي في الجزائر ومعدلاتها؟">💻 الإعلام الآلي</button>
                        <button class="hero-chip" data-q="شنو تخصصات الهندسة المتاحة ومعدلات القبول؟">⚙️ الهندسة</button>
                        <button class="hero-chip" data-q="كيفاش نرتّب بطاقة الرغبات ديالي بطريقة صحيحة؟">📋 بطاقة الرغبات</button>
                    </div>
                </section>
                <!-- messages injected here -->
            </div>
        </div>

        <div class="composer-wrap">
            <form class="composer" id="composer">
                <div class="attach-preview" id="attachPreview"></div>
                <div class="composer-row">
                    <button type="button" class="attach-btn" id="attachBtn" aria-label="إرفاق ملف"><i class="fas fa-plus"></i></button>
                    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp" multiple hidden>
                    <textarea id="input" rows="1" placeholder="اكتب سؤالك لمرشدك… (عربية، français، wala darija)"></textarea>
                    <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="إرسال"><i class="fas fa-arrow-up"></i></button>
                </div>
            </form>
            <p class="composer-hint">المرشد يعتمد على بيانات الدليل الوزاري — أكّد دائماً اختيارك على البوابة الرسمية.</p>
        </div>
    </main>
</div>

<!-- ===================== CHAT HISTORY OVERLAY ===================== -->
<div class="hist-scrim" id="histScrim"></div>
<aside class="hist-panel" id="histPanel" aria-label="المحادثات السابقة">
    <div class="hist-head">
        <span class="hist-title"><i class="fas fa-clock-rotate-left"></i> محادثاتك</span>
        <button class="icon-btn" id="histClose" aria-label="إغلاق"><i class="fas fa-xmark"></i></button>
    </div>
    <button class="hist-new" id="histNewChat"><i class="fas fa-pen-to-square"></i> محادثة جديدة</button>
    <div class="hist-list" id="histList"></div>
</aside>

<script src="shell.js"></script>
<script src="catalog.js"></script>
<script src="eligibility.js"></script>
<script src="app.js"></script>
</body>
</html>
