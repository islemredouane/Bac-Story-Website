    <script>
    (function () {
        function buildShareBtn() {
            if (document.getElementById('uniShareBtn')) return;
            const btn = document.createElement('button');
            btn.id = 'uniShareBtn';
            btn.className = 'uni-share-btn visible';
            btn.setAttribute('data-tooltip', 'مشاركة الصفحة');
            btn.innerHTML = '<i class="fas fa-share"></i>';
            btn.addEventListener('click', function () {
                const url = location.href;
                const title = document.title;
                if (navigator.share) {
                    navigator.share({ title, url }).catch(function () {});
                } else {
                    navigator.clipboard.writeText(url).then(function () { showToast('تم نسخ الرابط ✓'); }).catch(function () {});
                }
            });
            document.body.appendChild(btn);
        }
        function showToast(msg) {
            var t = document.getElementById('uniShareToast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'uniShareToast';
                t.className = 'uni-share-toast';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.classList.add('visible');
            clearTimeout(t._timer);
            t._timer = setTimeout(function () { t.classList.remove('visible'); }, 2200);
        }
        window.addEventListener('load', buildShareBtn);
    })();
    </script>
