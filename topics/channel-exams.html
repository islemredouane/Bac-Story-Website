        const chTopics = {
            _specialty: null,

            selectSpecialty(key) {
                this._specialty = key;
                const d = _chData[key];
                if (d.has2025) {
                    // Show year picker
                    document.getElementById('ch-year-title').textContent = 'شعبة ' + d.label + ' — اختر السنة';
                    showSection('channel-topics-year');
                } else {
                    // Skip year, go straight to 2026 subjects
                    this._renderSubjects(d.subjects2026, d.label + ' — 2026');
                }
            },

            selectYear(year) {
                const d = _chData[this._specialty];
                if (year === 2025) {
                    this._renderSubjects(d.subjects2025, d.label + ' — 2025');
                } else {
                    this._renderSubjects(d.subjects2026, d.label + ' — 2026');
                }
            },

            goBackToPrevious() {
                const d = _chData[this._specialty];
                if (d.has2025) {
                    showSection('channel-topics-year');
                } else {
                    showSection('channel-topics');
                }
            },

            _renderSubjects(subjects, title) {
                document.getElementById('ch-subjects-title').textContent = 'مواد ' + title;
                const grid = document.getElementById('ch-subjects-grid');
                grid.innerHTML = '';
                subjects.forEach(sub => {
                    const btn = document.createElement('button');
                    btn.className = 'main-btn';
                    btn.innerHTML = `<i class="${sub.i}"></i> ${sub.n}`;
                    if (sub.l && sub.l !== '#') {
                        btn.onclick = () => window.open(sub.l, '_blank');
                    } else {
                        btn.disabled = true;
                        btn.style.opacity = '0.5';
                        btn.title = 'قريباً';
                    }
                    grid.appendChild(btn);
                });
                showSection('channel-topics-subjects');
            }
        };
