<script>
    function updatePillPosition() {
        const activeTab = document.querySelector('.pdf-switcher-tab.active');
        const pill = document.getElementById('pdfTabPill');
        const bar = document.getElementById('pdfTabBar');
        if (!activeTab || !pill || !bar) return;
        pill.style.width = activeTab.offsetWidth + 'px';
        pill.style.left = activeTab.offsetLeft + 'px';
    }

    function switchPdf(btn, fileId) {
        document.querySelectorAll('.pdf-switcher-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updatePillPosition();

        const frame = document.getElementById('pdfFrame');
        if (frame) {
            frame.src = 'https://drive.google.com/file/d/' + fileId + '/preview';
        }

        const downBtn = document.getElementById('downloadPdfBtn');
        if (downBtn) {
            downBtn.href = 'https://drive.google.com/uc?export=download&id=' + fileId;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(updatePillPosition, 100);
    });
    window.addEventListener('resize', updatePillPosition);
</script>
